# Workflow for deploying static content to GitHub Pages + Embarko
name: Deploy static content to Pages and Embarko

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ── Embarko auto-deploy ──────────────────────────────────────────────────
      # Every push to main also updates https://medipulse-live.embarko.app
      # Requires secret: Settings → Secrets → Actions → EMBARKO_TOKEN
      # This step is optional — it never blocks the GitHub Pages deploy above.
      - name: Package static files for Embarko
        if: ${{ secrets.EMBARKO_TOKEN != '' }}
        run: |
          tar -czf /tmp/medipulse.tar.gz \
            index.html hospital.html admin.html \
            css/ js/

      - name: Deploy to Embarko
        if: ${{ secrets.EMBARKO_TOKEN != '' }}
        continue-on-error: true
        run: |
          curl -sS -X POST "https://ship.embarko.ai/apps" \
            -H "X-App-Name: medipulse-live" \
            -H "X-Agent-Name: github-actions" \
            -H "Authorization: Bearer ${{ secrets.EMBARKO_TOKEN }}" \
            -F "source=@/tmp/medipulse.tar.gz;type=application/gzip"
