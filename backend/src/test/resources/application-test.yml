server:
  port: 0

spring:
  application:
    name: medipulse-backend-test

  datasource:
    url: jdbc:h2:mem:medipulsetest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names:
      - hospitalSearchResults
    caffeine:
      spec: maximumSize=500,expireAfterWrite=15s,recordStats

medipulse:
  ranking:
    distance-weight: 0.6
    freshness-weight: 0.4
  jwt:
    secret: MedPulseSecretKeyForJwtAuthenticationSuperSecure32BytesLongMinimumKey!
    expiration-ms: 3600000
  mock-mode:
    notifications: true
    ocr: true
  outbox:
    fixed-delay-ms: 1000
    batch-size: 10
    max-retries: 3

resilience4j:
  circuitbreaker:
    instances:
      ocrService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 3
        minimumNumberOfCalls: 2
        failureRateThreshold: 50.0
        waitDurationInOpenState: 2s
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
      notificationService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 3
        minimumNumberOfCalls: 2
        failureRateThreshold: 50.0
        waitDurationInOpenState: 2s
        permittedNumberOfCallsInHalfOpenState: 1

  ratelimiter:
    instances:
      searchRateLimiter:
        limitForPeriod: 50
        limitRefreshPeriod: 60s
        timeoutDuration: 0ms

logging:
  level:
    root: INFO
    com.medipulse: DEBUG
