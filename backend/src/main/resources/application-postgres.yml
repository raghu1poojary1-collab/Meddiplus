server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: medipulse-backend

  # ===================================================================
  # DATASOURCE — Remote PostgreSQL Database
  # Host: 129.159.230.220:8056, DB: Mediplus, User: Raghavendra
  # ===================================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://129.159.230.220:8056/Mediplus}
    username: ${DB_USERNAME:Raghavendra}
    password: ${DB_PASSWORD:Raghvendra@6767}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MediPulsePostgresPool
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  # ===================================================================
  # JPA & HIBERNATE CONFIGURATION FOR POSTGRESQL
  # ===================================================================
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # Flyway disabled for remote PostgreSQL (schema already provisioned & verified)
  flyway:
    enabled: false

  # Cache configuration
  cache:
    type: caffeine
    cache-names:
      - hospitalSearchResults
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=15s,recordStats

